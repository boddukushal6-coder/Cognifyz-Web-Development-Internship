<!DOCTYPE html>
<html>
<head>
    <title>Level 1 Task 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        h1 {
            color: blue;
        }

        img {
            width: 300px;
            margin-top: 15px;
            border-radius: 10px;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph -->
    <p>
        This webpage is created for Cognifyz Web Development Internship.
    </p>

    <!-- Image -->
    <img src="https://via.placeholder.com/300" alt="Sample Image">

    <!-- Form -->
    <form>
        <input type="text" placeholder="Enter Your Name">
        <button type="submit">Submit</button>
    </form>

</body>
</html>
