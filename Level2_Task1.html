<!DOCTYPE html>
<html>
<head>
    <title>Level 2 Task 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Level 2 Task 1
    </h1>

    <!-- Card Component -->

    <div class="card mx-auto" style="width: 18rem;">

        <img src="https://via.placeholder.com/300x200"
             class="card-img-top"
             alt="Image">

        <div class="card-body">

            <h5 class="card-title">
                Web Development
            </h5>

            <p class="card-text">
                This is a responsive card created using Bootstrap.
            </p>

            <a href="#"
               class="btn btn-primary">
               Learn More
            </a>

        </div>

    </div>

    <hr class="my-5">

    <!-- Responsive Grid Layout -->

    <div class="row">

        <div class="col-md-4">
            <div class="p-3 border bg-light">
                Column 1
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-3 border bg-light">
                Column 2
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-3 border bg-light">
                Column 3
            </div>
        </div>

    </div>

</div>

</body>
</html>
