<!DOCTYPE html>
<html>
<head>
<title>Level 2 Task 2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
}

nav{
    background:black;
    padding:15px;
}

nav ul{
    list-style:none;
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
}

.menu-btn{
    display:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.content{
    padding:30px;
}

.boxes{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.box{
    flex:1;
    background:lightgray;
    padding:40px;
    text-align:center;
}

/* Mobile View */

@media(max-width:768px){

    nav ul{
        flex-direction:column;
    }

    .boxes{
        flex-direction:column;
    }

    .menu-btn{
        display:block;
    }
}

</style>

</head>

<body>

<nav>

<div class="menu-btn">
☰
</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>

<div class="content">

<h1>Responsive Webpage</h1>

<p>
This page adapts to different screen sizes using CSS media queries.
</p>

<div class="boxes">

<div class="box">Box 1</div>

<div class="box">Box 2</div>

<div class="box">Box 3</div>

</div>

</div>

</body>
</html>
