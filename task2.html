<!DOCTYPE html>
<html>
<head>
    <title>Level 1 Task 2</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2{
            color: blue;
        }

        button{
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        input{
            padding: 8px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>JavaScript Tasks</h1>

    <!-- Task 1 -->
    <h2>Color Change Button</h2>

    <button id="colorBtn">
        Click Me
    </button>

    <hr>

    <!-- Task 2 -->
    <h2>Greeting Message</h2>

    <button onclick="showGreeting()">
        Greeting
    </button>

    <hr>

    <!-- Task 3 -->
    <h2>Simple Calculator</h2>

    <input
    type="number"
    id="num1"
    placeholder="First Number">

    <br><br>

    <input
    type="number"
    id="num2"
    placeholder="Second Number">

    <br><br>

    <button onclick="addNumbers()">
        Add
    </button>

    <p id="result"></p>

    <script>

        document.getElementById("colorBtn").onclick =
        function(){

            document.body.style.backgroundColor =
            "yellow";

        }

        function showGreeting(){

            let hour =
            new Date().getHours();

            if(hour < 12){

                alert("Good Morning");

            }

            else if(hour < 18){

                alert("Good Afternoon");

            }

            else{

                alert("Good Evening");

            }
        }

        function addNumbers(){

            let n1 =
            Number(
            document.getElementById("num1").value
            );

            let n2 =
            Number(
            document.getElementById("num2").value
            );

            let sum =
            n1 + n2;

            document.getElementById("result")
            .innerHTML =
            "Result = " + sum;
        }

    </script>

</body>
</html>
